      font-weight: 800;
      cursor: pointer;

    .cta:hover { transform: translateY(-1px); }
    .cta.red {
      background: linear-gradient(135deg, var(--red), var(--red-2));
      border-color: var(--red);

    const brands = [...new Set(products.map(p => p.brand))].sort();
    const brandSelect = document.getElementById('brand');
    brandSelect.innerHTML += brands.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');

    const cart = [];

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[m]));
    }

    function money(value) {
      return new Intl.NumberFormat('es-CU').format(Math.round(value)) + ' CUP';
    }

    function renderProducts() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const brand = document.getElementById('brand').value;
      const availability = document.getElementById('availability').value;

      const filtered = products.filter((p) => {
        const matchesQuery = !q || p.model.toLowerCase().includes(q);
        const matchesBrand = !brand || p.brand === brand;
        const matchesAvailability = !availability || (availability === 'yes' ? p.qty > 0 : p.qty <= 0);
        return matchesQuery && matchesBrand && matchesAvailability;
      });

      const html = filtered.map((p) => {
        const idx = products.indexOf(p);
        const ok = p.qty > 0;
        return `
          <article class="product">
            <span class="tag">${escapeHtml(p.brand)}</span>
            <h3>${escapeHtml(p.model)}</h3>
            <div class="price">${money(p.cup)}</div>
            <div class="usd">≈ US$${p.usd.toFixed(2)} · Pantalla</div>
            <div class="stock ${ok ? 'ok' : 'no'}">${ok ? `Disponible: ${p.qty}` : 'Agotada'}</div>
            <div class="actions">
              <button class="small-btn primary" ${ok ? '' : 'disabled'} onclick="addToCart(${idx}, false)">Pantalla sola</button>
              <button class="small-btn" ${ok ? '' : 'disabled'} onclick="addToCart(${idx}, true)">+ montaje</button>
            </div>
          </article>
        `;
      }).join('') || '<div class="empty">No hay modelos con esos filtros.</div>';

      document.getElementById('products').innerHTML = html;
    }

    function addToCart(index, withMount) {
      const item = products[index];
      cart.push({ item, withMount });
      renderCart();
    }

    function renderCart() {
      const cartItems = document.getElementById('cartItems');
      if (!cart.length) {
        cartItems.innerHTML = '<div class="empty">Tu pedido está vacío.</div>';
        document.getElementById('total').textContent = 'Total: 0 CUP';
        return;
      }

      let total = 0;
      cartItems.innerHTML = cart.map((entry, i) => {
        const base = entry.item.cup + (entry.withMount ? MOUNT : 0);
        total += base;
        return `
          <div class="cart-row">
            <strong>${escapeHtml(entry.item.brand)} ${escapeHtml(entry.item.model)}</strong>
            <small>${entry.withMount ? 'Con montaje' : 'Pantalla sola'}</small>
            <div>${money(base)}</div>
            <button onclick="removeFromCart(${i})">Quitar</button>
          </div>
        `;
      }).join('');

      document.getElementById('total').textContent = 'Total: ' + money(total);
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function sendWhatsApp() {
      if (!cart.length) return;
      const lines = cart.map((entry) => {
        const base = entry.item.cup + (entry.withMount ? MOUNT : 0);
        return `• ${entry.item.brand} ${entry.item.model} — ${entry.withMount ? 'con montaje' : 'pantalla sola'} — ${money(base)}`;
      });
      const total = cart.reduce((sum, entry) => sum + entry.item.cup + (entry.withMount ? MOUNT : 0), 0);
      const text = encodeURIComponent(`Hola Active Unlock, quiero este pedido:\n${lines.join('\n')}\n\nTotal: ${money(total)}`);
      window.open(`https://wa.me/5355323969?text=${text}`, '_blank');
    }

    document.getElementById('search').addEventListener('input', renderProducts);
    document.getElementById('brand').addEventListener('change', renderProducts);
    document.getElementById('availability').addEventListener('change', renderProducts);

    renderProducts();
    renderCart();
